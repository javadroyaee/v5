name: Build and Release Signed APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Download Official Xray Core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          ls -lh app/libs/libv2ray.aar
      - name: Generate Release Keystore
        run: keytool -genkey -v -keystore app/release.keystore -alias avangkey -keyalg RSA -keysize 2048 -validity 10000 -storepass avangvpnpass -keypass avangvpnpass -dname "CN=AvangVPN, OU=Dev, O=Avang, L=Tehran, ST=Tehran, C=IR"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Avang-VPN-Release.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avang-VPN-Release-APK
          path: Avang-VPN-Release.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Avang-VPN-Release.apk
          name: Avang VPN ${{ github.ref_name }}
          body: "Signed Release APK with Real Xray Core & HevSocks5Tunnel"
          draft: false
          prerelease: false
